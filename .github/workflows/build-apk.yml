name: Build GTA PIYUSH APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q GTAPiyushProject.zip -d project

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project/NavratriArcAndroid
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GTA-PIYUSH-APK
          path: project/NavratriArcAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
